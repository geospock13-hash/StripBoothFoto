name: Compilar APK (Android)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Instalar dependencias (Capacitor)
        run: npm install

      - name: Generar la plataforma Android
        run: npx cap add android

      - name: Integrar plugin de carpeta (SAF)
        run: |
          PKG=android/app/src/main/java/com/artefgo/stripboothfoto
          mkdir -p "$PKG"
          cp native/FolderSaf.java "$PKG/FolderSaf.java"
          python3 - <<'PY'
          import re
          mp = 'android/app/src/main/java/com/artefgo/stripboothfoto/MainActivity.java'
          s = open(mp, encoding='utf-8').read()
          if 'registerPlugin(FolderSaf.class)' not in s:
              s = re.sub(
                  r'public class MainActivity extends BridgeActivity\s*\{\s*\}',
                  ('public class MainActivity extends BridgeActivity {\n'
                   '  @Override\n'
                   '  public void onCreate(android.os.Bundle savedInstanceState) {\n'
                   '    registerPlugin(FolderSaf.class);\n'
                   '    super.onCreate(savedInstanceState);\n'
                   '  }\n'
                   '}'),
                  s)
              open(mp, 'w', encoding='utf-8').write(s)
              print('MainActivity: plugin registrado')
          bg = 'android/app/build.gradle'
          g = open(bg, encoding='utf-8').read()
          if 'androidx.documentfile' not in g:
              g = re.sub(r'(dependencies\s*\{)',
                         r"\1\n    implementation 'androidx.documentfile:documentfile:1.0.1'",
                         g, count=1)
              open(bg, 'w', encoding='utf-8').write(g)
              print('build.gradle: documentfile agregado')
          PY

      - name: Agregar permisos (cámara / almacenamiento)
        run: |
          python3 - <<'PY'
          import re
          f = 'android/app/src/main/AndroidManifest.xml'
          s = open(f, encoding='utf-8').read()
          perms = (
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
          )
          if 'android.permission.CAMERA' not in s:
              s = s.replace('<application', perms + '\n    <application', 1)
          if 'requestLegacyExternalStorage' not in s:
              s = re.sub(r'(<application\b)', r'\1 android:requestLegacyExternalStorage="true"', s, count=1)
          open(f, 'w', encoding='utf-8').write(s)
          print('Manifest actualizado con permisos.')
          PY

      - name: Sincronizar web + plugins
        run: npx cap sync android

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: StripBoothFoto-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
